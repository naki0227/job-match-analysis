name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Contracts
        run: pnpm exec oxlint packages/contracts/src packages/contracts/tests

      - name: Typecheck Contracts
        run: pnpm --filter @job-match/contracts typecheck

      - name: Test Contracts
        run: pnpm --filter @job-match/contracts test

      - name: Build Contracts
        run: pnpm --filter @job-match/contracts build

  domain:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Domain
        run: pnpm exec oxlint packages/domain/src packages/domain/tests

      - name: Typecheck Domain
        run: pnpm --filter domain typecheck

      - name: Test Domain
        run: pnpm --filter domain test

      - name: Build Domain
        run: pnpm --filter domain build

  web:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared contracts
        run: pnpm --filter @job-match/contracts build

      - name: Lint Web
        run: pnpm exec oxlint apps/web/src apps/web/tests apps/web/e2e apps/web/playwright.config.ts

      - name: Test Web
        run: pnpm --filter web test

      - name: Test Web E2E
        run: pnpm test:e2e

      - name: Build Web
        run: pnpm --filter web build

  api:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared contracts
        run: pnpm --filter @job-match/contracts build

      - name: Lint API
        run: pnpm exec oxlint apps/api/src apps/api/scripts apps/api/tests

      - name: Typecheck API
        run: pnpm --filter api typecheck

      - name: Test API
        run: pnpm --filter api test

      - name: Build API
        run: pnpm --filter api build

  common:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

  docker:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t job-match-api:ci .

      - name: Build Web image
        run: docker build -f apps/web/Dockerfile -t job-match-web:ci .
