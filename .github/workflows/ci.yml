name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Contracts
        run: pnpm exec oxlint packages/contracts/src packages/contracts/tests

      - name: Typecheck Contracts
        run: pnpm --filter @job-match/contracts typecheck

      - name: Test Contracts
        run: pnpm --filter @job-match/contracts test

      - name: Build Contracts
        run: pnpm --filter @job-match/contracts build

  domain:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Domain
        run: pnpm exec oxlint packages/domain/src packages/domain/tests

      - name: Typecheck Domain
        run: pnpm --filter @job-match/domain typecheck

      - name: Test Domain
        run: pnpm --filter @job-match/domain test

      - name: Build Domain
        run: pnpm --filter @job-match/domain build

  application:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts and domain
        run: pnpm --filter @job-match/contracts build && pnpm --filter @job-match/domain build

      - name: Lint Application
        run: pnpm exec oxlint packages/application/src packages/application/tests

      - name: Typecheck Application
        run: pnpm --filter @job-match/application typecheck

      - name: Test Application
        run: pnpm --filter @job-match/application test

      - name: Build Application
        run: pnpm --filter @job-match/application build

  api:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @job-match/contracts build && pnpm --filter @job-match/domain build && pnpm --filter @job-match/application build

      - name: Lint API
        run: pnpm exec oxlint apps/api/src apps/api/scripts apps/api/tests

      - name: Typecheck API
        run: pnpm --filter api typecheck

      - name: Test API
        run: pnpm --filter api test

      - name: Build API
        run: pnpm --filter api build

  crawler:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @job-match/contracts build && pnpm --filter @job-match/domain build

      - name: Lint Crawler
        run: pnpm exec oxlint apps/crawler/src apps/crawler/tests

      - name: Typecheck Crawler
        run: pnpm --filter crawler typecheck

      - name: Test Crawler
        run: pnpm --filter crawler test

      - name: Build Crawler
        run: pnpm --filter crawler build

  common:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: |
          pnpm exec prettier --write apps/api/src/worker-trigger/azure-container-apps-job.ts
          git diff -- apps/api/src/worker-trigger/azure-container-apps-job.ts
          git diff --quiet -- apps/api/src/worker-trigger/azure-container-apps-job.ts

  docker:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t job-match-api:ci .

      - name: Build Web image
        run: docker build -f apps/web/Dockerfile -t job-match-web:ci .
