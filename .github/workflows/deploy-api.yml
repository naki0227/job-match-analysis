name: Deploy API

# Images builds both API and crawler for the same commit. The API is deployed
# by digest and receives the matching crawler digest. The API managed identity
# then starts the crawler Job with a per-execution template, so production
# needs only Microsoft.App/jobs/start/action on the Job resource.
on:
  workflow_run:
    workflows: [Images]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      digest:
        description: "Existing job-match-api digest to deploy or roll back to (sha256:...)"
        required: true
      crawler_digest:
        description: "Matching job-match-crawler digest (sha256:...)"
        required: true

concurrency:
  group: deploy-api-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/job-match-api
  CRAWLER_IMAGE: ghcr.io/${{ github.repository_owner }}/job-match-crawler
  AZURE_RESOURCE_GROUP: job-match-prod
  AZURE_CONTAINER_APP: job-match-api
  HEALTH_URL: https://api.career.enludus.com/health

jobs:
  deploy:
    if: >-
      vars.API_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event != 'pull_request'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Resolve image digests
        id: digest
        env:
          INPUT_DIGEST: ${{ inputs.digest }}
          INPUT_CRAWLER_DIGEST: ${{ inputs.crawler_digest }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -n "$INPUT_DIGEST" ]; then
            api_digest="$INPUT_DIGEST"
            crawler_digest="$INPUT_CRAWLER_DIGEST"
          else
            api_digest=$(docker buildx imagetools inspect "${IMAGE}:sha-${HEAD_SHA}"               --format '{{json .Manifest}}' | jq -r .digest)
            crawler_digest=$(docker buildx imagetools inspect "${CRAWLER_IMAGE}:sha-${HEAD_SHA}"               --format '{{json .Manifest}}' | jq -r .digest)
          fi
          for digest in "$api_digest" "$crawler_digest"; do
            if ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
              echo "Invalid image digest" >&2
              exit 1
            fi
          done
          docker buildx imagetools inspect "${IMAGE}@${api_digest}" > /dev/null
          docker buildx imagetools inspect "${CRAWLER_IMAGE}@${crawler_digest}" > /dev/null
          echo "api_digest=$api_digest" >> "$GITHUB_OUTPUT"
          echo "crawler_digest=$crawler_digest" >> "$GITHUB_OUTPUT"

      - name: Log in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API and pin crawler execution
        env:
          API_DIGEST: ${{ steps.digest.outputs.api_digest }}
          CRAWLER_DIGEST: ${{ steps.digest.outputs.crawler_digest }}
        run: |
          az containerapp update             --name "$AZURE_CONTAINER_APP"             --resource-group "$AZURE_RESOURCE_GROUP"             --image "${IMAGE}@${API_DIGEST}"             --set-env-vars               PORT=3000               ANALYZER_VERSION=analysis-v11               JOB_RESOLVER_MAX_CANDIDATES=20               JOB_RESOLVER_LISTING_LIMIT=20               JOB_RESOLVER_KNOWN_LISTING_MINIMUM=5               JOB_RESOLVER_SEARCH_LIMIT=30               JOB_RESOLVER_SEARCH_WINDOW_SECONDS=3600               JOB_RESOLVER_JEV_TIMEOUT_MS=10000               JOB_DISCOVERY_FRESHNESS_SECONDS=86400               JOB_DISCOVERY_USER_LIMIT=10               JOB_DISCOVERY_WINDOW_SECONDS=86400               JOB_DISCOVERY_MAX_ACTIVE=20               JOB_DISCOVERY_RETENTION_SECONDS=2592000               CRAWLER_EXECUTION_IMAGE="${CRAWLER_IMAGE}@${CRAWLER_DIGEST}"               CRAWLER_SUPABASE_SECRET_REF=supabase-secret-key               CRAWLER_JEV_SECRET_REF=jev-api-key               CRAWLER_DRAIN_MAX_JOBS=10               CRAWLER_LEASE_SECONDS=120               CRAWLER_MAX_ATTEMPTS=2               CRAWLER_RETENTION_BATCH_SIZE=100               CRAWLER_MAX_EXCERPT_CHARS=200               CRAWLER_MAX_EVIDENCE_PER_AXIS=3               CRAWLER_POLL_INTERVAL_MS=1000               CRAWLER_JEV_DAILY_CANDIDATE_BUDGET=unlimited               CRAWLER_WEB_SEARCH_PROVIDER=ddgs               CRAWLER_DDGS_REGION=jp-jp               CRAWLER_DDGS_TIMEOUT_MS=10000               CRAWLER_DISCOVERY_MAX_QUERIES=3               CRAWLER_DISCOVERY_RESULTS_PER_QUERY=10               CRAWLER_DISCOVERY_MAX_FETCHES=20               CRAWLER_DISCOVERY_MAX_LINKS_PER_LISTING=20               CRAWLER_DISCOVERY_MAX_RESULTS=20

      - name: Verify the deployed API digest and health
        env:
          API_DIGEST: ${{ steps.digest.outputs.api_digest }}
        run: |
          deployed=$(az containerapp show             --name "$AZURE_CONTAINER_APP"             --resource-group "$AZURE_RESOURCE_GROUP"             --query 'properties.template.containers[0].image' -o tsv)
          if [ "$deployed" != "${IMAGE}@${API_DIGEST}" ]; then
            echo "Container App runs $deployed" >&2
            exit 1
          fi
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 20 "$HEALTH_URL"; then
              echo "### Deployed ${IMAGE}@${API_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          exit 1
