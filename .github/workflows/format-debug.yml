name: Format Debug

on:
  push:
    branches: [fix/match-job-facts]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write apps/api/src/repositories/matches.ts apps/crawler/src/deterministic-parser.ts packages/domain/src/prefecture.ts
          git diff -- apps/api/src/repositories/matches.ts apps/crawler/src/deterministic-parser.ts packages/domain/src/prefecture.ts
