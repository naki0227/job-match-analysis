server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:3000/;
    }

    # Share pages and OG images are rendered by the API (Issue #39).
    location /s/ {
        proxy_pass http://api:3000;
    }
}