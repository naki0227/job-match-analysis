name: Images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/crawler/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/images.yml"
      - ".github/workflows/deploy-api.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/crawler/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/images.yml"
      - ".github/workflows/deploy-api.yml"

permissions:
  contents: read

jobs:
  # Pull requests only prove the images build for the Azure target.
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [api, crawler]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.image }} (linux/amd64, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # main publishes amd64 (Azure) and arm64 (future OCI) and reports digests;
  # deployments reference the digest, not a mutable tag. A successful main run
  # hands that digest to the crawler-first production deploy chain.
  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [api, crawler]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.image }}
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/job-match-${{ matrix.image }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/job-match-${{ matrix.image }}:main
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Smoke test both platforms by digest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/job-match-${{ matrix.image }}@${{ steps.push.outputs.digest }}
          KIND: ${{ matrix.image }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            if [ "$KIND" = api ]; then
              docker run --rm --platform "$platform" -w /app/apps/api --entrypoint node "$IMAGE" \
                -e "import('@resvg/resvg-js').then(()=>import('/app/apps/api/dist/share-page/og-font.js')).then(m=>m.loadOgFont()).then(f=>console.log(process.arch,'font',f.length))"
            else
              docker run --rm --platform "$platform" -w /app/apps/crawler "$IMAGE" \
                node -e "console.log(process.arch, process.env.CRAWLER_BROWSER_EXECUTABLE)"
              # DDGS is the pinned version with its DuckDuckGo engine (no network).
              docker run --rm --platform "$platform" --entrypoint /opt/ddgs/bin/python "$IMAGE" \
                /app/apps/crawler/ddgs/search.py --self-check
            fi
            # A digest reference holds one platform locally at a time.
            docker image rm "$IMAGE"
          done
      - name: Record digest
        run: |
          echo "### job-match-${{ matrix.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${{ github.repository_owner }}/job-match-${{ matrix.image }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
