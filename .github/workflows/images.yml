name: Images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/crawler/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/images.yml"
      - ".github/workflows/deploy-api.yml"
      - "scripts/check-image.sh"
      - "scripts/smoke-image.sh"
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/crawler/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/images.yml"
      - ".github/workflows/deploy-api.yml"
      - "scripts/check-image.sh"
      - "scripts/smoke-image.sh"

permissions:
  contents: read

jobs:
  # Pull requests only prove the images build for the Azure target.
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [api, crawler]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.image }} (linux/amd64, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: job-match-${{ matrix.image }}:pr
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Check non-root user and no baked secrets
        run: sh scripts/check-image.sh job-match-${{ matrix.image }}:pr
      - name: Smoke test read-only
        run: sh scripts/smoke-image.sh ${{ matrix.image }} job-match-${{ matrix.image }}:pr

  # main publishes amd64 (Azure) and arm64 (future OCI) and reports digests;
  # deployments reference the digest, not a mutable tag. A successful main run
  # hands that digest to the crawler-first production deploy chain.
  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [api, crawler]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.image }}
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/job-match-${{ matrix.image }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/job-match-${{ matrix.image }}:main
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Smoke test and check both platforms by digest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/job-match-${{ matrix.image }}@${{ steps.push.outputs.digest }}
          KIND: ${{ matrix.image }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            sh scripts/smoke-image.sh "$KIND" "$IMAGE" "$platform"
            sh scripts/check-image.sh "$IMAGE" "$platform"
            # A digest reference holds one platform locally at a time.
            docker image rm "$IMAGE"
          done
      - name: Record digest
        run: |
          echo "### job-match-${{ matrix.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${{ github.repository_owner }}/job-match-${{ matrix.image }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
