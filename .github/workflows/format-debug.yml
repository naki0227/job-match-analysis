name: Format Debug

on:
  push:
    branches: [fix/reduce-unknown-job-analysis]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write apps/crawler/src/deterministic-parser.ts
          git diff -- apps/crawler/src/deterministic-parser.ts
