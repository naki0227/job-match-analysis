name: DB migration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "supabase/rollback/**"
      - "scripts/test-db-migration.sh"
      - "scripts/test-db-restore.sh"
      - "apps/api/scripts/test-analysis-history-db.ts"
      - "apps/api/scripts/test-analysis-parallel.ts"
      - "apps/api/scripts/test-match-share-db.ts"
      - "apps/crawler/tests/job-recovery.integration.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/db-migration.yml"
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "supabase/rollback/**"
      - "scripts/test-db-migration.sh"
      - "scripts/test-db-restore.sh"
      - "apps/api/scripts/test-analysis-history-db.ts"
      - "apps/api/scripts/test-analysis-parallel.ts"
      - "apps/api/scripts/test-match-share-db.ts"
      - "apps/crawler/tests/job-recovery.integration.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/db-migration.yml"

permissions:
  contents: read

jobs:
  migration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test migration, constraints, RLS, and rollback
        run: sh scripts/test-db-migration.sh

      - name: Test dummy-data backup and isolated restore
        run: sh scripts/test-db-restore.sh
