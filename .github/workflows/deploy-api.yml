name: Deploy API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/contracts/**"
      - "packages/domain/**"
      - "packages/application/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-api.yml"

concurrency:
  group: deploy-api-production
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/naki0227/job-match-api
  AZURE_RESOURCE_GROUP: job-match-prod
  AZURE_CONTAINER_APP: job-match-api

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    if: ${{ vars.API_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Log in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Configure public GHCR registry
        run: |
          az containerapp registry set             --name "${AZURE_CONTAINER_APP}"             --resource-group "${AZURE_RESOURCE_GROUP}"             --server ghcr.io

      - name: Deploy immutable image digest
        run: |
          az containerapp update             --name "${AZURE_CONTAINER_APP}"             --resource-group "${AZURE_RESOURCE_GROUP}"             --image "${IMAGE_NAME}@${{ needs.publish.outputs.digest }}"             --set-env-vars PORT=80

      - name: Verify production health
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error               --max-time 10               https://api.career.enludus.com/health; then
              exit 0
            fi
            sleep 5
          done
          exit 1
